name: Sync stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Sync stats from rxerium.com
        run: node scripts/sync-stats.mjs --source https://rxerium.com/api/about --fallback https://rxerium.com/data/about.json --readme README.md
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No stats changes to commit."
          else
            git commit -m "chore: sync profile stats from rxerium.com"
            git push
          fi
